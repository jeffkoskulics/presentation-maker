<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo overlay</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0b1220; color: #eef2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  div { max-width: 480px; padding: 2rem; }
  h1 { margin-top: 0; }
  p { color: #9fb0c3; }
</style>
</head>
<body>
  <div>
    <h1>This is an overlay</h1>
    <p>Any self-contained HTML file can be wired up this way — a map, a video
    gallery, live data, anything. It's declared once in <code>OVERLAYS</code>
    in <code>deck.html</code> and bound to a key globally.</p>
    <p>Press Esc, or the same key again, to close.</p>
  </div>
</body>
</html>
